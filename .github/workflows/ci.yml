name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python quality and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Reject committed AWS credentials
        run: |
          key_id_pattern='(AKI[A]|ASI[A])[A-Z0-9]{16}'
          secret_key_pattern='AWS_SECRET_ACCESS_KE[Y]=[^.#[:space:]]'
          session_token_pattern='AWS_SESSION_TOKE[N]=[^.#[:space:]]'
          if git grep -l -E "${key_id_pattern}|${secret_key_pattern}|${session_token_pattern}"; then
            echo "Potential AWS credentials found in tracked files" >&2
            exit 1
          fi

      - name: Lint Python
        run: PYTHON=python make lint

      - name: Check Python formatting
        run: PYTHON=python make format-check

      - name: Check shell scripts
        run: bash -n scripts/bootstrap.sh deploy/ssm_deploy.sh

      - name: Validate API contracts
        run: PYTHON=python make contract

      - name: Validate P6 demo data
        run: PYTHON=python make demo

      - name: Run tests
        run: PYTHON=python make test

  container:
    name: Build and smoke-test backend image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build backend image
        run: docker build --tag ai-rec-diagnostics:ci --file backend/Dockerfile .

      - name: Start backend container
        run: docker run --detach --name ai-rec-ci --publish 18000:8000 --env MODE=mock ai-rec-diagnostics:ci

      - name: Verify health endpoint
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 20 http://127.0.0.1:18000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs ai-rec-ci
          exit 1

      - name: Stop backend container
        if: always()
        run: docker rm --force ai-rec-ci >/dev/null 2>&1 || true

  frontend:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Shopper Simulator
            directory: frontend-simulator
          - app: Diagnosis and Debate
            directory: frontend-diagnosis

    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Runtime smoke test
        run: npm test --if-present
