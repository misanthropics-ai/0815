version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend-simulator
    schedule:
      interval: weekly
      day: monday
    groups:
      simulator-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend-diagnosis
    schedule:
      interval: weekly
      day: monday
    groups:
      diagnosis-dependencies:
        patterns: ["*"]
