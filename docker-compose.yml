services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - backend/.env          # AWS creds + model config (gitignored)
    volumes:
      - backend-data:/app/backend/data   # sqlite + caches persist across restarts
    restart: unless-stopped

volumes:
  backend-data:
